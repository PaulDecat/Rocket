# Déploiement gratuit sur Render (https://render.com) : New → Blueprint → choisir ce dépôt.
services:
  - type: web
    name: rocket
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/config
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_LEAD
        sync: false
      - key: ELEVENLABS_VOICE_CO
        sync: false
